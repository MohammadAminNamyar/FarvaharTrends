name: farvahar_trends
description: "FarvaharTrends — a signed bulletin delivery pilot with no required central server."
publish_to: 'none'
version: 0.8.12+23

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_background_service: 5.1.0
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  basic_utils: 5.8.2
  pointycastle: 4.0.0
  crypto: 3.0.7
  flutter_pear:
    path: packages/flutter_pear
  pilot_platform:
    path: packages/pilot_platform
  qr_flutter: 4.1.0
  url_launcher: 6.3.3

dev_dependencies:
  # Exercise the locally patched service messenger used by the Android app.
  flutter_background_service_android: 6.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Local upstream 6.3.1 source with balanced service wake-lock ownership.
dependency_overrides:
  flutter_background_service_android:
    path: packages/flutter_background_service_android

flutter:
  uses-material-design: true
  assets:
    - assets/bootstrap.json
    - assets/brand/farvahar-mark.png
    - assets/fonts/OFL.txt
    - assets/fonts/Vazirmatn-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/farvahar-mark.png
  min_sdk_android: 29
  remove_alpha_ios: true
  background_color_ios: "#102E42"
  adaptive_icon_background: "#102E42"
  adaptive_icon_foreground: android/app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png
