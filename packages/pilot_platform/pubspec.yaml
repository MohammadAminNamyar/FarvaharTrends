name: pilot_platform
description: Device state and deliberate report export for the FarvaharTrends pilot.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: org.farvahartrends.platform
        pluginClass: PilotPlatformPlugin
      ios:
        pluginClass: PilotPlatformPlugin
